# نشر تجريبي — خدمة واحدة على الباقة المجانية (SQLite، بدون قاعدة مُدارة)
services:
  - type: web
    name: assaafa-hotels
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    healthCheckPath: /api/public/site/
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
